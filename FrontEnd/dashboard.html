<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard Guru - Star Bright Kreatif</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2"
          href="#"
        >
          <img
            src="assets/logo.png"
            alt="Star Bright Kreatif"
            class="navbar-logo"
          />
          Star Bright Kreatif
        </a>

        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">
          Logout
        </button>
      </div>
    </nav>

    <!-- Dashboard -->
    <main class="container py-5">
      <div class="mb-4">
        <h2 class="fw-bold">
          Dashboard Guru 👋
          <span id="teacherName"></span>
        </h2>
        <p class="text-muted">Kelola perkembangan siswa</p>
      </div>

      <!-- Search -->
      <div class="mb-4">
        <input
          type="text"
          id="searchStudent"
          class="form-control"
          placeholder="🔍 Cari siswa..."
        />
      </div>

      <!-- Student List -->
      <div id="studentList" class="row g-4">
        <div class="text-center py-5">
          <div class="spinner-border text-primary"></div>

          <p class="text-muted mt-2">Memuat data siswa...</p>
        </div>
      </div>
    </main>

    <script src="js/guard.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
