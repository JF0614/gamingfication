<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard Guru - Star Bright Kreatif</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div
      class="modal fade"
      id="addStudentModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Tambah Siswa</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <form id="addStudentForm">
            <div class="modal-body">
              <div id="addStudentMessage" class="alert d-none"></div>

              <div class="mb-3">
                <label class="form-label fw-semibold"> Username </label>

                <input
                  type="text"
                  id="studentUsername"
                  class="form-control"
                  placeholder="Masukkan username siswa"
                  minlength="3"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold"> Password </label>

                <input
                  type="password"
                  id="studentPassword"
                  class="form-control"
                  placeholder="Minimal 6 karakter"
                  minlength="6"
                  required
                />
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Batal
              </button>

              <button type="submit" id="addStudentBtn" class="btn btn-primary">
                Daftarkan Siswa
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2"
          href="#"
        >
          <img
            src="assets/logo.png"
            alt="Star Bright Kreatif"
            class="navbar-logo"
          />
          Star Bright Kreatif
        </a>

        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">
          Logout
        </button>
      </div>
    </nav>

    <!-- Dashboard -->
    <main class="container py-5">
      <div class="mb-4">
        <h2 class="fw-bold">
          Dashboard Guru 👋
          <span id="teacherName"></span>
        </h2>
        <p class="text-muted">Kelola perkembangan siswa</p>
      </div>

      <!-- Search -->
      <div class="d-flex justify-content-between align-items-center mb-4 gap-3">
        <div class="flex-grow-1">
          <input
            type="text"
            id="searchStudent"
            class="form-control"
            placeholder="🔍 Cari siswa..."
          />
        </div>

        <button
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#addStudentModal"
        >
          + Tambah Siswa
        </button>
      </div>

      <!-- Student List -->
      <div id="studentList" class="row g-4">
        <div class="text-center py-5">
          <div class="spinner-border text-primary"></div>

          <p class="text-muted mt-2">Memuat data siswa...</p>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
