<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gamingfication - Login</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="bg-light">
    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
          <div class="login-card shadow-lg">
            <div class="text-center mb-4">
              <div class="brand-icon">
                <img src="assets/Logo.png" alt="Star Bright Kreatif" />
              </div>

              <h2 class="fw-bold mt-3 mb-1">Star Bright Kreatif</h2>

              <p class="text-muted mb-0">Selamat datang kembali 👋</p>
            </div>

            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label fw-semibold"> Username </label>

                <div class="input-group">
                  <span class="input-group-text"> 👤 </span>

                  <input
                    type="text"
                    id="username"
                    class="form-control"
                    placeholder="Masukkan username"
                    required
                  />
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold"> Password </label>

                <div class="input-group">
                  <span class="input-group-text"> 🔒 </span>

                  <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Masukkan password"
                    required
                  />
                </div>
              </div>

              <div id="message" class="alert d-none"></div>

              <button
                type="submit"
                class="btn btn-primary w-100 py-2 fw-semibold"
              >
                Login
              </button>
            </form>

            <div class="text-center mt-4">
              <small class="text-muted"> Star Bright Kreatif © 2026 </small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
  </body>
</html>
