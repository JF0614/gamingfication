<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Profile Siswa - Star Bright Kreatif</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar bg-white shadow-sm">
      <div class="container">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2"
          href="dashboard.html"
        >
          <img
            src="assets/logo.png"
            alt="Star Bright Kreatif"
            class="navbar-logo"
          />
          Star Bright Kreatif
        </a>

        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">
          Logout
        </button>
      </div>
    </nav>

    <main class="container py-5">
      <div
        id="notification"
        class="alert d-none position-fixed top-0 end-0 m-3 shadow"
        role="alert"
        style="z-index: 1050"
      ></div>
      <a href="dashboard.html" class="btn btn-light mb-4"> ← Kembali </a>

      <div id="profileContainer">
        <div class="text-center py-5">
          <div class="spinner-border text-primary"></div>

          <p class="text-muted mt-2">Memuat profile...</p>
        </div>
      </div>
    </main>

    <script src="js/guard.js"></script>
    <script src="js/api.js"></script>
    <script src="js/student.js"></script>
  </body>
</html>
